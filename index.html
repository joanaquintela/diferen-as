<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pares de razões</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: #fbffd7;
    height: 100%;
    overflow: hidden;
  }

  .wrap {
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 48px;
  }

  button.play {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: #b8552e;
    border: none;
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
    transition: background 0.15s ease, transform 0.1s ease;
    padding: 0;
  }
  button.play:hover { background: #a24a27; }
  button.play:active { transform: scale(0.94); }
  button.play:focus-visible { outline: 2px solid #1a2028; outline-offset: 3px; }
  button.play.playing { background: #6b6459; }

  .triangle {
    width: 0;
    height: 0;
    border-top: 12px solid transparent;
    border-bottom: 12px solid transparent;
    border-left: 20px solid #fff;
    margin-left: 6px;
  }

  .bars {
    display: none;
    gap: 5px;
  }
  .bars span {
    width: 6px;
    height: 22px;
    background: #fff;
    border-radius: 1px;
  }
  button.play.playing .triangle { display: none; }
  button.play.playing .bars { display: flex; }
</style>
</head>
<body>
<div class="wrap">
  <button class="play" id="play1" aria-label="Tocar 64:45 e 7:5"></button>
  <button class="play" id="play2" aria-label="Tocar 8:5 e 13:8"></button>
  <button class="play" id="play3" aria-label="Tocar 16:9 e 7:4"></button>
</div>

<script>
(() => {
  const F0 = 200; // frequência de referência

  const SEQUENCES = {
    play1: [64/45, 7/5],
    play2: [8/5, 13/8],
    play3: [16/9, 7/4],
  };

  const STEP = 0.9;      // segundos entre o início das duas notas
  const NOTE_DUR = 1.15;  // duração/decaimento de cada nota

  let actx = null;
  const playingState = {};

  function playNote(freq, when, dur, dest) {
    const harmonics = [
      { mult: 1, amp: 1.00 },
      { mult: 2, amp: 0.45 },
      { mult: 3, amp: 0.22 },
    ];

    const noteGain = actx.createGain();
    noteGain.gain.setValueAtTime(0.0001, when);
    noteGain.gain.exponentialRampToValueAtTime(0.8, when + 0.008);
    noteGain.gain.exponentialRampToValueAtTime(0.28, when + 0.18);
    noteGain.gain.exponentialRampToValueAtTime(0.0001, when + dur);

    const filter = actx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 3500;
    filter.Q.value = 0.6;

    noteGain.connect(filter);
    filter.connect(dest);

    harmonics.forEach(h => {
      const osc = actx.createOscillator();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq * h.mult, when);
      const g = actx.createGain();
      g.gain.value = h.amp;
      osc.connect(g);
      g.connect(noteGain);
      osc.start(when);
      osc.stop(when + dur + 0.05);
    });
  }

  Object.keys(SEQUENCES).forEach(id => {
    const btn = document.getElementById(id);
    btn.innerHTML = '<div class="triangle"></div><div class="bars"><span></span><span></span></div>';
    playingState[id] = false;

    btn.addEventListener('click', () => {
      if (playingState[id]) return;
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') actx.resume();

      playingState[id] = true;
      btn.classList.add('playing');

      const now = actx.currentTime;
      const master = actx.createGain();
      master.gain.value = 0.5;
      master.connect(actx.destination);

      const ratios = SEQUENCES[id];
      const freqs = ratios.map(r => F0 * r);
      freqs.forEach((f, i) => playNote(f, now + i * STEP, NOTE_DUR, master));

      const total = (freqs.length - 1) * STEP + NOTE_DUR + 0.2;
      setTimeout(() => {
        playingState[id] = false;
        btn.classList.remove('playing');
      }, total * 1000);
    });
  });
})();
</script>
</body>
</html>
